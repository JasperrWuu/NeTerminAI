[package]
name = "neterminai"
version = "0.1.0"
description = "A calm, capable terminal workbench"
authors = ["NeTerminAI contributors"]
edition = "2024"

[lib]
name = "neterminai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
